<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask your PDF</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Ask your PDF</h1>
    <p class="sub">Upload a PDF, ask a question, get an answer from its content.</p>

    <form id="form">
      <label class="file" for="pdf">
        <span id="file-name">Choose a PDF file</span>
        <input type="file" id="pdf" accept="application/pdf" required />
      </label>

      <textarea id="question" rows="3" placeholder="What would you like to know?" required></textarea>

      <button type="submit" id="submit">Get answer</button>
    </form>

    <section id="result" class="result hidden">
      <h2>Answer</h2>
      <p id="answer"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
